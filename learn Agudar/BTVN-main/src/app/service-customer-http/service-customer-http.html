<p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

<table border="1">
    <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>#</th>
        </tr>
    </thead>
    <tbody>
        <ng-container *ngFor="let customerGroup of customerGroups">
            <tr>
                <td colspan="5">{{ customerGroup.CustomerTypeId }} - {{ customerGroup.CustomterTypeName }}</td>
            </tr>
            <tr *ngFor="let customer of customerGroup.Customers">
                <td>{{ customer.Id }}</td>
                <td>{{ customer.Name }}</td>
                <td>{{ customer.Email }}</td>
                <td>{{ customer.Age }}</td>
                <td><img [src]="customer.Image" [alt]="customer.Name"></td>
            </tr>
        </ng-container>
    </tbody>
</table>
