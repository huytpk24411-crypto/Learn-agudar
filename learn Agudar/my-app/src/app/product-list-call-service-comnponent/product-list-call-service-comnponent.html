<p>product-list-call-service-component works!</p>
<div>
    Min price: <input type="number" [(ngModel)]="minPrice">
    Max price: <input type="number" [(ngModel)]="maxPrice">
    <button (click)="doFilterByPrice()">Filter</button>
</div>
<ol>
    @for (product of products; track product.id) {
    <li>
        {{ product.name }} - ${{ product.price }}
        @if (product.image) {
            <img [src]="product.image" [alt]="product.name" width="100" height="100">
        }
    </li>
    }

</ol>
