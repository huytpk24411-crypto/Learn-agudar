<table>

        <td colspan="2">
            Phuong trinh bac 1

            He so a:

    <tr>
        <td>
            He so b:
        </td>
        <td>
            <input type="number" [value]="hsb" #inputB>

    <tr>
        <td>
            Ket qua:
        </td>
        <td id="tdketqua" #view>
        </td>

    <tr>
        <td colspan="2">
            <button (click)="giaiPt(inputA.valueAsNumber, inputB.valueAsNumber, view)">Giai</button>
